* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

a { color: var(--link); }

.lang button[aria-pressed="true"] { background: #fff; color: #1f3b5c; border-color: #fff; font-weight: 600; }
.nav { border-bottom: 1px solid var(--line); background: var(--band); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }

.nav button { flex: none; background: transparent; border: 0; border-bottom: 3px solid transparent; padding: 11px 12px 8px; font: inherit; font-size: 14.5px; color: var(--text-2); cursor: pointer; white-space: nowrap; }

section { border-top: 1px solid var(--line); padding-top: 14px; min-width: 0; }

.bar-cell { width: 34%; } .b { height: 7px; display: block; background: var(--link); }

dl.facts dt, dl.facts dd { margin: 0; padding: 8px 0; border-bottom: 1px solid var(--line); }
dl.facts dd { text-align: right; font-weight: 600; padding-left: 16px; }
ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.btn { display: inline-block; font: inherit; font-size: 14.5px; padding: 9px 14px; min-height: 42px; border: 1px solid var(--bar); background: var(--bar); color: var(--on-bar); border-radius: 3px; cursor: pointer; text-decoration: none; }
.btn.alt { background: transparent; color: var(--link); border-color: var(--link); }

      if (shownTotal > 0) html += '<section><h3>' + esc(T('why_h')) + '</h3>' + reasonTable(agg, shownTotal, mk === 'ALL' ? 'var(--link)' : 'var(--m-' + mk + ')') + '</section>';
      html += '<section><h3>' + esc(T('trend_h')) + '</h3>' + trendChart(id, mk) + '</section>';
    }
    if (p3) {
      html += '<section><h3>' + esc(T('rules_h')) + '</h3><p style="margin-bottom:6px"><span class="muted">' + esc(T('hazard')) + ':</span> ' + esc(L(p3.hazard)) + '</p>' +
        '<table><thead><tr><th>' + esc(T('market')) + '</th><th>' + esc(T('limit')) + '</th></tr></thead><tbody>' +
        [['EU', 'rules_eu', p3.eu], ['US', 'rules_us', p3.us], [null, 'rules_in', p3.india]].map(function (r) { return '<tr><td style="white-space:nowrap">' + (r[0] ? mtag(r[0]).replace(esc(mname(r[0])), esc(T(r[1]))) : esc(T(r[1]))) + '</td><td>' + esc(L(r[2])) + '</td></tr>'; }).join('') + '</tbody></table>' +
        '<p style="margin-top:10px"><b>' + esc(T('gap_' + p3.type)) + '</b></p><details><summary>' + esc(T('more_h')) + '</summary><div>' + esc(L(p3.finding)) + '</div></details></section>' +
        '<section><h3>' + esc(T('todo_h')) + '</h3><ul>' + p3.fix.map(function (f) { return '<li>' + esc(L(f)) + '</li>'; }).join('') + '</ul></section>';
    } else html += '<section><h3>' + esc(T('rules_h')) + '</h3><p class="muted">' + esc(T('no_limits')) + '</p></section>';
    var nw = D.news.filter(function (x) { return x.c === id; }).slice(0, 3);
    if (nw.length) html += '<section><h3>' + esc(T('news_h')) + '</h3>' + nw.map(newsHtml).join('') + '<p style="margin-top:6px"><button type="button" class="btn alt" data-act="newsfor">' + esc(T('all_news')) + '</button></p></section>';
    var idx = D.cats.indexOf(c), al = D.alerts.filter(function (a) { return a.cats && a.cats.indexOf(c.fdaIdx != null ? c.fdaIdx : D.fdaMap[id]) >= 0; });
    var recent = X.rowsBy[id].filter(function (r) { return mk === 'ALL' || r[0] === mk; });
    html += '<section>' + (D.fdaMap[id] != null ? '<details><summary>' + esc(T('alerts_h')) + ' (' + al.length + ')</summary><div>' + (al.length ? al.map(function (a) { return '<div class="rec"><div class="meta"><b style="color:var(--text)">' + esc(a.n) + '</b></div><div>' + esc(a.t) + '</div><a class="small" href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(T('al_link')) + '</a></div>'; }).join('') : '<p class="small muted">' + esc(T('no_alerts')) + '</p>') + '</div></details>' : '') +
      '<details><summary>' + esc(T('recent_h')) + ' (' + N(recent.length) + ')</summary><div>' + recent.slice(0, 5).map(function (r) { return recHtml(r, false); }).join('') + (recent.length ? '<p style="margin-top:8px"><button type="button" class="btn alt" data-act="seerec">' + esc(T('all_records')(N(recent.length))) + '</button></p>' : '') + '</div></details></section>';
    html += '<div class="row"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(shareText(c, mk, n, rate, inf)) + '">' + esc(T('share_wa')) + '</a><button type="button" class="btn alt" data-act="copy">' + esc(T('copy')) + '</button></div>';
    return html;
  }
  function shareText(c, mk, n, rate, inf) {
    var p3 = c.p3 && D.limits[c.p3];
    var lines = ['Clearance: ' + c[st.lang] + ' (' + (mk === 'ALL' ? T('all_markets') : mname(mk)) + ')', T('priority') + ': ' + T('tier_' + inf.tier) + ' · ' + T('f_rej') + ': ' + n + (rate != null ? ' · ' + T('f_rate') + ': ' + F1(rate) : '')];
    if (p3) { lines.push(L(p3.hazard)); lines.push(T('rules_eu') + ': ' + L(p3.eu)); lines.push(T('rules_us') + ': ' + L(p3.us)); lines.push(T('rules_in') + ': ' + L(p3.india)); }
    return lines.join('\n');
  }
  function viewRanking() {
    var rank = { HIGH: 0, MEDIUM: 1, WATCH: 2, NONE: 3 }, s = st.sort;
    var list = D.cats.filter(function (c) { return X.cnt[c.id].total > 0; }), empty = D.cats.filter(function (c) { return X.cnt[c.id].total === 0; });
    function val(c) {
      var i = X.info[c.id], cn = X.cnt[c.id];
      switch (s.k) {
        case 'name': return c[st.lang].toLowerCase();
        case 'tier': return rank[i.tier] * 10000 - cn.total;
        case 'total': return -cn.total;
        case 'rate': return c.rateComb == null ? 1e9 : -c.rateComb;
        default: return cn[s.k] != null ? -cn[s.k] : 0;
      }
    }
    list.sort(function (a, b) { var x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * s.dir || a[st.lang].localeCompare(b[st.lang]); });
    function th(k, label, cls) { var on = s.k === k; return '<th class="' + (cls || '') + '"' + (on ? ' aria-sort="' + (s.dir > 0 ? 'ascending' : 'descending') + '"' : '') + '><button type="button" data-act="sort" data-v="' + k + '"' + (on ? ' data-dir="' + (s.dir > 0 ? '▲' : '▼') + '"' : '') + '>' + label + '</button></th>'; }
    var rows = list.map(function (c) {
      var i = X.info[c.id], cn = X.cnt[c.id], fa = D.fdaMap[c.id] != null ? D.alerts.filter(function (a) { return a.cats && a.cats.indexOf(D.fdaMap[c.id]) >= 0 || a.general; }).length : 0;
      return '<tr class="click" data-act="open" data-v="' + c.id + '"><td><a href="#check" data-act="open" data-v="' + c.id + '">' + esc(c[st.lang]) + '</a></td><td style="white-space:nowrap"><span class="tier ' + i.tier + '">' + esc(T('tier_' + i.tier)) + '</span></td><td class="r num"><b>' + N(cn.total) + '</b></td>' +
        MK.map(function (m) { return '<td class="r num">' + (cn[m] ? N(cn[m]) : '<span class="muted">·</span>') + '</td>'; }).join('') +
        '<td class="r num">' + (c.rateComb != null ? F1(c.rateComb) + (c.id === 'coriander' ? ' *' : '') : '—') + '</td><td>' + esc(i.gap ? T('gapword_' + i.gap) : '—') + '</td></tr>';
    }).join('');
    return '<h2>' + esc(T('rank_title')) + '</h2><section class="first">' + docsBox() + '<div class="scroll"><table><thead><tr>' + th('name', esc(T('th_product'))) + th('tier', esc(T('th_tier'))) + th('total', esc(T('th_total')), 'r') +
      MK.map(function (m) { return th(m, sw(m) + esc(mname(m)), 'r'); }).join('') + th('rate', esc(T('th_rate')), 'r') + '<th>' + esc(T('th_gap')) + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p class="small muted" style="margin-top:8px">' + esc(T('rank_key')) + '</p>' +
      (empty.length ? '<details><summary>' + esc(T('no_records_h')) + ' (' + empty.length + ')</summary><div>' + empty.map(function (c) { return '<a href="#check" data-act="open" data-v="' + c.id + '">' + esc(c[st.lang]) + '</a>'; }).join(' · ') + '</div></details>' : '') + '</section>' +
      '<section><h3>' + esc(T('slope_h')) + '</h3>' + slopeChart() + '</section>';
  }
  function viewNews() {
    var f = st.nf, items = D.news.filter(function (n) { return (!f.cat || n.c === f.cat) && (!f.mk || n.m.indexOf(f.mk) >= 0) && (!f.alerts || n.a); });
    var ev = D.events.filter(function (e) { return (!f.cat || e.c === f.cat) && (!f.mk || (e.m || []).indexOf(f.mk) >= 0); }).sort(function (a, b) { return a.d < b.d ? 1 : -1; });
    var html = '<h2>' + esc(T('news_title')) + '</h2><section class="first"><div class="filters">' +
      '<div><label class="k" for="n-cat">' + esc(T('f_cat')) + '</label>' + catSelect('n-cat', f.cat, 'data-nf="cat"', true) + '</div>' +
      '<div><label class="k" for="n-mk">' + esc(T('f_mkt')) + '</label>' + mktSelect('n-mk', f.mk, 'data-nf="mk"', T('f_any_market'), true) + '</div></div>' +
      '<label class="chk"><input type="checkbox" data-nf="alerts"' + (f.alerts ? ' checked' : '') + '>' + esc(T('f_alerts')) + '</label>' +
      (D.newsUpdated ? '<p class="small muted">' + esc(T('news_updated')) + ' ' + esc(fdate(D.newsUpdated.slice(0, 10))) + '</p>' : '') + '</section>';
    if (ev.length) html += '<section><h3>' + esc(T('events_h')) + '</h3>' + ev.map(function (e) {
      return '<div class="news"><span class="flag">' + esc(T('flag')) + '</span><a class="h" href="' + esc(e.u) + '" target="_blank" rel="noopener">' + esc(e.t) + '</a><div class="meta"><span>' + esc(fdate(e.d)) + '</span><span>' + esc(e.s) + '</span><span>' + (e.m || []).map(function (m) { return esc(mname(m)); }).join(' · ') + (e.c ? ' · ' + esc(cname(e.c)) : '') + '</span></div></div>';
    }).join('') + '</section>';
    html += '<section>' + (items.length ? items.slice(0, 120).map(newsHtml).join('') : '<p class="empty">' + esc(D.news.length ? T('news_empty') : T('news_none')) + '</p>') + '</section>';
    return html;
  }
  function filteredRecords() {
    var f = st.rf, q = f.q.trim().toLowerCase();
    return D.rows.filter(function (r) {
      if (f.cat && r[1] !== f.cat) return false;
      if (f.mk && r[0] !== f.mk) return false;
      if (f.reason && r[2].indexOf(f.reason) < 0) return false;
      if (q && (r[5] + ' ' + r[7]).toLowerCase().indexOf(q) < 0 && cat(r[1]).en.toLowerCase().indexOf(q) < 0 && cat(r[1]).hi.indexOf(q) < 0) return false;
      return true;
    });
  }
  function recResults() {
    var all = filteredRecords(), part = all.slice(0, st.shown);
    if (!all.length) return '<p class="empty">' + esc(T('no_match')) + '</p>';
    return '<div class="row" style="justify-content:space-between;align-items:center"><p class="small muted">' + esc(T('showing')(N(part.length), N(all.length))) + '</p><button type="button" class="btn alt" data-act="csv">' + esc(T('csv')) + '</button></div><div>' + part.map(function (r) { return recHtml(r, true); }).join('') + '</div>' +
      (part.length < all.length ? '<p style="margin-top:10px"><button type="button" class="btn alt" data-act="more">' + esc(T('more')) + '</button></p>' : '');
  }
  function viewRecords() {
    var f = st.rf;
    var ro = '<option value="">' + esc(T('f_all')) + '</option>' + D.reasons.map(function (r) { return '<option value="' + r.id + '"' + (f.reason === r.id ? ' selected' : '') + '>' + esc(r[st.lang]) + '</option>'; }).join('');
    return '<h2>' + esc(T('rec_title')) + '</h2><section class="first"><div class="filters">' +
      '<div><label class="k" for="f-cat">' + esc(T('f_cat')) + '</label>' + catSelect('f-cat', f.cat, 'data-f="cat"', true) + '</div>' +
      '<div><label class="k" for="f-mkt">' + esc(T('f_mkt')) + '</label>' + mktSelect('f-mkt', f.mk, 'data-f="mk"', T('f_any_market'), false).replace('value="ALL"', 'value=""') + '</div>' +
      '<div><label class="k" for="f-reason">' + esc(T('f_reason')) + '</label><select id="f-reason" data-f="reason">' + ro + '</select></div>' +
      '<div><label class="k" for="f-q">' + esc(T('f_search')) + '</label><input id="f-q" type="search" data-f="q" placeholder="' + esc(T('f_search_ph')) + '" value="' + esc(f.q) + '"></div></div></section>' +
      '<section id="rec-results">' + recResults() + '</section>';
  }
  function alertCard(a) {
    var tags = (a.cats || []).map(function (i) { return esc(D.fdaNames[i] ? short(D.catById[D.fdaNames[i]]) : ''); }).filter(Boolean).join(', ');
    return '<div class="rec"><div class="meta"><b style="color:var(--text)">' + esc(a.n) + '</b>' + (tags ? '<span>' + tags + '</span>' : '') + '</div><div>' + esc(a.t) + '</div>' +
      (a.why ? '<div class="small muted">' + esc(T('al_why')) + ': ' + esc(a.why) + '</div>' : '') + '<a class="small" href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(T('al_link')) + '</a></div>';
  }
  function viewAlerts() {
    var rel = D.alerts.filter(function (a) { return a.cats && a.cats.length; }), gen = D.alerts.filter(function (a) { return a.general; }), oth = D.alerts.filter(function (a) { return !(a.cats && a.cats.length) && !a.general; });
    return '<h2>' + esc(T('al_title')) + '</h2><section class="first"><h3>' + esc(T('al_rel')) + ' (' + rel.length + ')</h3>' + rel.map(alertCard).join('') + '</section>' +
      '<section><h3>' + esc(T('al_gen')) + ' (' + gen.length + ')</h3>' + gen.map(alertCard).join('') + '</section>' +
      '<section><details><summary>' + esc(T('al_other')) + ' (' + oth.length + ')</summary><div>' + oth.map(function (a) { return '<div class="rec"><b>' + esc(a.n) + '</b> ' + esc(a.t) + '</div>'; }).join('') + '</div></details></section>';
  }
  function stateOf(h, isSeedOnly) {
    if (!h || !h.status) return ['st-na', T(isSeedOnly ? 'st_snap' : 'st_none')];
    if (h.status === 'ok') return ['st-ok', T('st_ok')];
    if (h.status === 'needs_key') return ['st-na', T('st_key')];
    return ['st-bad', T('st_bad')];
  }
  function viewSources() {
    var rows = D.meta.markets.map(function (m) {
      var seedOnly = (m.id === 'EU' || m.id === 'US') && !(m.health && m.health.status), s = stateOf(m.health, seedOnly);
      return '<tr><td>' + mtag(m.id) + '</td><td><a href="' + SRC[m.id][1] + '" target="_blank" rel="noopener">' + esc(SRC[m.id][0]) + '</a></td><td class="num">' + (m.newest ? esc(fdate(m.newest)) : '—') + '</td><td class="num">' + (m.health && m.health.last_ok ? esc(m.health.last_ok.slice(0, 10)) : '—') + '</td><td class="' + s[0] + '">' + esc(s[1]) + '</td></tr>' +
        (m.health && m.health.status === 'error' ? '<tr><td></td><td colspan="4" class="small muted">' + esc(m.health.error) + '</td></tr>' : '');
    }).join('');
    var nh = D.meta.news || {}, ns = stateOf(nh, false);
    return '<h2>' + esc(T('src_title')) + '</h2><section class="first"><div class="scroll"><table style="min-width:560px"><thead><tr><th>' + esc(T('market')) + '</th><th>' + esc(T('th_src')) + '</th><th>' + esc(T('th_latest')) + '</th><th>' + esc(T('th_checked')) + '</th><th>' + esc(T('th_status')) + '</th></tr></thead><tbody>' + rows +
      '<tr><td></td><td>' + esc(T('news_src')) + '</td><td class="num">' + (D.newsUpdated ? esc(fdate(D.newsUpdated.slice(0, 10))) : '—') + '</td><td class="num">' + (nh.last_ok ? esc(nh.last_ok.slice(0, 10)) : '—') + '</td><td class="' + ns[0] + '">' + esc(ns[1]) + '</td></tr></tbody></table></div></section>' +
      '<section><h3>' + esc(T('counted_h')) + '</h3><ul>' + T('counted').map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></section>';
  }

  /* ---------- render */
  function render() {
    document.body.setAttribute('data-lang', st.lang); document.documentElement.lang = st.lang;
    document.getElementById('tagline').textContent = T('tagline');
    document.querySelectorAll('#langseg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === st.lang)); });
    document.getElementById('tabs').innerHTML = TABS.map(function (k) { return '<button type="button" role="tab" data-act="tab" data-v="' + k + '" aria-selected="' + (k === st.tab) + '">' + esc(T('tab_' + k)) + '</button>'; }).join('');
    var html = { check: viewCheck, ranking: viewRanking, news: viewNews, records: viewRecords, alerts: viewAlerts, sources: viewSources }[st.tab]();
    document.getElementById('main').innerHTML = html;
    var newest = ''; D.meta.markets.forEach(function (m) { if (m.newest > newest) newest = m.newest; });
    document.getElementById('foot').textContent = T('disc') + (newest ? ' · ' + T('data_to') + ' ' + fdate(newest) : '');
  }
  function save() { try { localStorage.setItem('clearance.v2', JSON.stringify({ lang: st.lang, cat: st.cat, mk: st.mk, docs: st.docs })); } catch (e) {} }
  function go(tab) { st.tab = tab; try { history.replaceState(null, '', '#' + tab); } catch (e) { location.hash = tab; } render(); window.scrollTo(0, 0); }

  var tip = document.getElementById('tip');
  function tipHandler(e) {
    var el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) { tip.hidden = true; return; }
    tip.textContent = el.getAttribute('data-tip'); tip.hidden = false;
    var x = e.clientX + 12, y = e.clientY - 34, w = tip.offsetWidth; if (x + w > window.innerWidth - 8) x = window.innerWidth - w - 8;
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
  }
  document.addEventListener('pointermove', tipHandler); document.addEventListener('pointerdown', tipHandler);
  document.addEventListener('scroll', function () { tip.hidden = true; }, true);

  function csvDownload() {
    var rows = filteredRecords(), out = ['destination,product,date,reasons,risk,description,reference'];
    rows.forEach(function (r) { out.push([r[0], cat(r[1]).en, r[3], r[2].join(';'), r[4], r[5], r[6]].map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',')); });
    var blob = new Blob(['﻿' + out.join('\n')], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'clearance-records.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');
    if (act === 'lang') { st.lang = v; save(); render(); }
    else if (act === 'tab') go(v);
    else if (act === 'open') { e.preventDefault(); st.cat = v; save(); go('check'); }
    else if (act === 'setmk') { st.mk = v; save(); render(); }
    else if (act === 'sort') { st.sort = st.sort.k === v ? { k: v, dir: -st.sort.dir } : { k: v, dir: 1 }; render(); }
    else if (act === 'seerec') { st.rf = { cat: st.cat, mk: st.mk === 'ALL' ? '' : st.mk, reason: '', q: '' }; st.shown = 40; go('records'); }
    else if (act === 'newsfor') { st.nf = { cat: st.cat, mk: '', alerts: false }; go('news'); }
    else if (act === 'more') { st.shown += 40; document.getElementById('rec-results').innerHTML = recResults(); }
    else if (act === 'csv') csvDownload();
    else if (act === 'retry') init();
    else if (act === 'copy') {
      var c = cat(st.cat), inf = X.info[st.cat], cn = X.cnt[st.cat], mk = st.mk, n = mk === 'ALL' ? cn.total : cn[mk], rate = mk === 'EU' ? c.rateEU : mk === 'US' ? c.rateUS : mk === 'ALL' ? c.rateComb : null, txt = shareText(c, mk, n, rate, inf);
      var done = function () { el.textContent = T('copied'); setTimeout(function () { el.textContent = T('copy'); }, 1600); };
      var fb = function () { var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (er) {} document.body.removeChild(ta); };
      try { navigator.clipboard.writeText(txt).then(done, fb); } catch (er) { fb(); }
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target, act = el.getAttribute && el.getAttribute('data-act');
    if (act === 'cat') { st.cat = el.value; save(); render(); }
    else if (act === 'mkt') { st.mk = el.value; save(); render(); }
    else if (act === 'docs') { st.docs = el.checked; save(); recompute(); render(); }
    var nf = el.getAttribute && el.getAttribute('data-nf');
    if (nf) { st.nf[nf] = nf === 'alerts' ? el.checked : el.value; render(); }
  });
  function onFilter(e) { var k = e.target.getAttribute && e.target.getAttribute('data-f'); if (!k) return; st.rf[k] = e.target.value; st.shown = 40; document.getElementById('rec-results').innerHTML = recResults(); }
  document.addEventListener('input', onFilter); document.addEventListener('change', onFilter);
  window.addEventListener('hashchange', function () { var h = (location.hash || '').replace('#', ''); if (D && TABS.indexOf(h) >= 0 && h !== st.tab) { st.tab = h; render(); } });

  /* ---------- start */
  function firstCat() {
    var best = null; D.cats.forEach(function (c) { var i = X.info[c.id]; if (i.rc && (!best || i.rc < X.info[best].rc)) best = c.id; }); return best || D.cats[0].id;
  }
  function init() {
    document.getElementById('main').innerHTML = '<div class="loading">' + esc(T('loading')) + '</div>';
    load().then(function () {
      // FDA alert category indexes (workbook order) -> category ids
      D.fdaNames = ['basmati', 'rice', 'shrimp', 'sesame', 'groundnut', 'pepper', 'chilli', 'coriander', 'cumin', 'turmeric', 'fenugreek', 'fennel', 'blends', 'mango', 'herbal'];
      D.fdaMap = {}; D.fdaNames.forEach(function (id, i) { D.fdaMap[id] = i; });
      recompute();
      if (!st.cat || !D.catById[st.cat]) st.cat = firstCat();
      render();
    }).catch(function (err) {
      document.getElementById('main').innerHTML = '<div class="empty"><p>' + esc(T('load_fail')) + '</p><p class="small">' + esc(err.message) + '</p><p style="margin-top:10px"><button type="button" class="btn" data-act="retry">' + esc(T('retry')) + '</button></p></div>';
    });
  }
  try {
    var sv = JSON.parse(localStorage.getItem('clearance.v2') || '{}');
    if (sv.lang === 'hi' || sv.lang === 'en') st.lang = sv.lang; else if ((navigator.language || '').toLowerCase().indexOf('hi') === 0) st.lang = 'hi';
    if (sv.cat) st.cat = sv.cat; if (sv.mk) st.mk = sv.mk; st.docs = !!sv.docs;
  } catch (e) { if ((navigator.language || '').toLowerCase().indexOf('hi') === 0) st.lang = 'hi'; }
  var h0 = (location.hash || '').replace('#', ''); if (TABS.indexOf(h0) >= 0) st.tab = h0;
  window.CL = { compute: function (o) { return compute(o); }, data: function () { return D; } };
  init();
})();
</script>
